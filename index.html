function renderMonth(){
  const y = focusDate.getFullYear(), m = focusDate.getMonth();
  $("range").textContent = y+"年"+(m+1)+"月";
  const mo = $("mo"); mo.replaceChildren();
  for(const i of [1,2,3,4,5,6,0]){
    const h = document.createElement("div"); h.className = "mo-wd" + (i===0 ? " sun" : i===6 ? " sat" : ""); h.textContent = WD[i]; mo.appendChild(h);
  }
  const first = new Date(y, m, 1), start = mondayOf(first);
  const last = new Date(y, m+1, 0);
  const weeks = Math.ceil(((last - start) / 86400000 + 1) / 7);
  const todayS = ymd(new Date());
  for(let i=0;i<weeks*7;i++){
    const d = addDays(start, i), ds = ymd(d);
    const cell = document.createElement("div"); cell.tabIndex = 0; cell.setAttribute("role", "button");
    cell.className = "mo-cell" + (d.getMonth()!==m ? " out" : "") + (ds===todayS ? " today" : "") + (d.getDay()===0 ? " sun" : d.getDay()===6 ? " sat" : "");
    const list = rows.filter(r => segOn(r, ds)).sort((a,b) => absS(a) - absS(b));
    cell.setAttribute("aria-label", (d.getMonth()+1)+"月"+d.getDate()+"日 予約"+list.length+"件");
    const dn = document.createElement("span"); dn.className = "mo-d"; dn.textContent = d.getDate();
    cell.appendChild(dn);
    for(const r of list.slice(0,3)){
      const ev = document.createElement("button"); ev.type = "button"; ev.className = "mo-ev" + (isMine(r) ? " mine" : "");
      ev.addEventListener("click", e => { e.stopPropagation(); openDetail(r); });
      const tm = document.createElement("span"); tm.className = "tm"; tm.textContent = segLabel(segOn(r, ds));
      ev.append(tm, r.name);
      attachHover(ev, r);
      cell.appendChild(ev);
    }
    if(list.length > 3){ const more = document.createElement("span"); more.className = "mo-more"; more.textContent = "他 "+(list.length-3)+" 件"; cell.appendChild(more); }
    cell.addEventListener("click", () => setView("day", d));
    cell.addEventListener("keydown", e => { if(e.target === cell && (e.key === "Enter" || e.key === " ")){ e.preventDefault(); setView("day", d); } });
    mo.appendChild(cell);
  }
  // 下の「使用状況」も同じ月に合わせる
  if(monthCursor.getFullYear() !== y || monthCursor.getMonth() !== m){ monthCursor = new Date(y, m, 1); renderUsage(); }
}

function renderTimeline(startDate, nDays){
  const tl = $("tl"); tl.replaceChildren();
  tl.style.gridTemplateColumns = "44px repeat("+nDays+", minmax(78px, 1fr))";
  tl.classList.toggle("one", nDays === 1);
  const end = addDays(startDate, nDays-1);
  $("range").textContent = nDays === 1 ? md(ymd(startDate)) : (startDate.getMonth()+1)+"/"+startDate.getDate()+" – "+(end.getMonth()+1)+"/"+end.getDate();
  const todayS = ymd(new Date());
  const corner = document.createElement("div"); corner.className = "tl-corner"; tl.appendChild(corner);
  for(let i=0;i<nDays;i++){
    const d = addDays(startDate,i), h = document.createElement("div");
    h.className = "tl-dayhead" + (ymd(d)===todayS ? " today" : "") + (d.getDay()===0 ? " sun" : d.getDay()===6 ? " sat" : "") + (nDays > 1 ? " link" : "");
    const s = document.createElement("span"); s.className = "d"; s.textContent = (d.getMonth()+1)+"/"+d.getDate();
    h.append(s, WD[d.getDay()]);
    if(nDays > 1){ h.title = "この日を表示"; h.addEventListener("click", () => setView("day", d)); }
    tl.appendChild(h);
  }
  const hours = document.createElement("div");
  for(let h=OPEN; h<CLOSE; h++){ const e = document.createElement("div"); e.className = "tl-hour"; e.textContent = h===OPEN ? "" : h+":00"; hours.appendChild(e); }
  tl.appendChild(hours);
  const totalPx = (CLOSE-OPEN)*HOUR_PX;
  for(let i=0;i<nDays;i++){
    const ds = ymd(addDays(startDate,i));
    const col = document.createElement("div");
    col.className = "tl-col" + (ds===todayS ? " today" : ds < todayS ? " past" : "");
    col.style.height = totalPx+"px";
    // Google カレンダーと同じく、クリックで1時間・ドラッグで好きな長さを選ぶ
    col.addEventListener("pointerdown", ev => {
      if(ev.target !== col || ev.button !== 0) return;
      const toSlot = y => Math.max(OPEN*60, Math.min(CLOSE*60, OPEN*60 + Math.floor(y / HOUR_PX * 60 / SLOT) * SLOT));
      const y0 = ev.clientY - col.getBoundingClientRect().top;
      const a = Math.min(toSlot(y0), CLOSE*60 - SLOT);
      let s = a, e = a + SLOT, moved = false;
      const ghost = document.createElement("div"); ghost.className = "ghost"; col.appendChild(ghost);
      const paint = () => { ghost.style.top = ((s-OPEN*60)/60*HOUR_PX)+"px"; ghost.style.height = Math.max((e-s)/60*HOUR_PX - 2, 10)+"px"; ghost.textContent = fromMin(s)+"–"+fromMin(e); };
      paint();
      const ac = new AbortController();
      try{ col.setPointerCapture(ev.pointerId); }catch(err){}
      col.addEventListener("pointermove", m => {
        const y = m.clientY - col.getBoundingClientRect().top;
        if(Math.abs(y - y0) > 6) moved = true;
        if(!moved) return;
        const b = toSlot(y);
        if(b >= a){ s = a; e = Math.min(Math.max(b + SLOT, a + SLOT), CLOSE*60); } else { s = b; e = a + SLOT; }
        paint();
      }, {signal: ac.signal});
      col.addEventListener("pointerup", () => {
        ac.abort(); ghost.remove();
        if(!moved){ s = a; e = Math.min(a + 60, CLOSE*60); }
        if($("f-date").disabled) return;   // 「これ以降すべて」の変更中は日付を動かさない
        $("f-date").value = ds; $("f-enddate").value = ds; lastStartDate = ds; $("f-start").value = fromMin(s); $("f-end").value = fromMin(e);
        fillRepeat(); checkForm();
        $("f-purpose").focus({preventScroll: window.innerWidth > 960});
      }, {signal: ac.signal});
      col.addEventListener("pointercancel", () => { ac.abort(); ghost.remove(); }, {signal: ac.signal});
    });
    for(const [g, lane, lanes] of layoutDay(rows.map(r => segOn(r, ds)).filter(Boolean))){
      const r = g.r;   // g はその日にかかる部分（日をまたぐ予約は日ごとに分けて描く）
      const b = document.createElement("button");
      b.type = "button";
      const rk = rankOf(r);
      b.className = "blk" + (isMine(r) ? " mine" : "") + (r.id===selected ? " sel" : "") + (rk > 1 ? " later" : "") + (r.pending ? " pending" : "");
      const top = Math.max(0, (toMin(g.start)-OPEN*60)/60*HOUR_PX);
      const bottom = Math.min(totalPx, (toMin(g.end)-OPEN*60)/60*HOUR_PX);
      b.style.top = top+"px"; b.style.height = Math.max(bottom-top-2, 10)+"px";
      if(lanes > 1){
        b.style.right = "auto";
        b.style.left = "calc(3px + (100% - 6px) * "+lane+" / "+lanes+")";
        b.style.width = "calc((100% - 6px) / "+lanes+" - 2px)";
        b.style.paddingInline = "4px";
      }
      if(bottom-top < 28) b.classList.add("short");
      const t = document.createElement("span"); t.className = "t"; t.textContent = b.classList.contains("short") && !g.cont ? g.start : segLabel(g);
      const n = document.createElement("span"); n.className = "n"; n.textContent = r.name;
      if(rk){ const k = document.createElement("span"); k.className = "rk"; k.textContent = rk === 1 ? "先" : rk; n.prepend(k); }
      b.append(t, n);
      if(b.classList.contains("short")){
        if(r.purpose) n.append(" ・ "+r.purpose);
      }else{
        const info = nDays === 1 ? [r.purpose, r.participants ? "参加者："+r.participants : ""].filter(Boolean).join(" ・ ") : r.purpose;
        if(info){ const pp = document.createElement("span"); pp.className = "p"; pp.textContent = info; b.appendChild(pp); }
      }
      attachHover(b, r);
      b.onclick = () => { selected = r.id; renderWeek(); renderList(); openDetail(r); };
      col.appendChild(b);
    }
    if(ds === todayS){
      const nm = now.getHours()*60+now.getMinutes();
      if(nm >= OPEN*60 && nm <= CLOSE*60){
        const line = document.createElement("div"); line.className = "nowline";
        line.style.top = ((nm-OPEN*60)/60*HOUR_PX)+"px"; col.appendChild(line);
      }
    }
    tl.appendChild(col);
  }
}

// 重なる予約を横に並べる：[予約, 列番号, 列数] を返す
function layoutDay(list){
  const sorted = [...list].sort((a,b) => a.start.localeCompare(b.start) || b.end.localeCompare(a.end));
  const out = [];
  let cluster = [], laneEnds = [], clusterEnd = "";
  const flush = () => { for(const x of cluster) out.push([x[0], x[1], laneEnds.length]); cluster = []; laneEnds = []; };
  for(const r of sorted){
    if(cluster.length && r.start >= clusterEnd) flush();
    let lane = laneEnds.findIndex(e => e <= r.start);
    if(lane < 0){ lane = laneEnds.length; laneEnds.push(r.end); } else laneEnds[lane] = r.end;
    cluster.push([r, lane]);
    clusterEnd = cluster.length === 1 ? r.end : (r.end > clusterEnd ? r.end : clusterEnd);
  }
  flush();
  return out;
}

// その日の予約が入っている時間（重なりは1回だけ数える）
function occupiedHours(list){
  const iv = list.map(r => [toMin(r.start), toMin(r.end)]).sort((a,b) => a[0]-b[0]);
  let total = 0, s = -1, e = -1;
  for(const [a,b] of iv){ if(a > e){ if(e > s) total += e-s; s = a; e = b; } else if(b > e) e = b; }
  if(e > s) total += e-s;
  return total/60;
}

function renderList(){
  const ul = $("upcoming"); ul.replaceChildren();
  const today = ymd(new Date()), t = hm(new Date());
  // 管理者は全員分、それ以外は自分の予約だけを並べる（他の人の予約はタイムラインで見られる）
  $("up-title").textContent = isAdmin ? "これからの予約（全員）" : "自分のこれからの予約";
  const na = nowAbs();
  const up = rows.filter(r => (isAdmin || isMine(r)) && absE(r) > na)
    .sort((a,b) => (a.date+a.start).localeCompare(b.date+b.start));
  $("up-count").textContent = up.length ? up.length+" 件" : "";
  if(!up.length){
    const p = document.createElement("p"); p.className = "empty";
    p.textContent = !loaded ? "読み込んでいます…" : isAdmin ? "これからの予約はありません。" : "あなたのこれからの予約はありません。タイムラインの空き枠をクリックするか、フォームから予約を入れてください。";
    ul.appendChild(p); return;
  }
  for(const r of up.slice(0,20)){
    const li = document.createElement("li");
    attachHover(li, r);
    if(r.id === selected) li.className = "sel";
    const w = document.createElement("div"); w.className = "when";
    const b = document.createElement("b"); b.textContent = md(r.date);
    w.append(b, timeText(r));
    const who = document.createElement("div"); who.className = "who";
    const s = document.createElement("strong"); s.textContent = r.name;
    const rk = rankOf(r);
    if(rk){ const c = document.createElement("span"); c.className = "rank " + (rk === 1 ? "first" : "later"); c.textContent = rankLabel(rk); s.appendChild(c); }
    if(r.series){ const c = document.createElement("span"); c.className = "rank rep"; c.textContent = "繰り返し"; s.appendChild(c); }
    const sp = document.createElement("span"); sp.textContent = [r.purpose || "用途未記入", r.participants ? "参加者："+r.participants : ""].filter(Boolean).join(" ・ ");
    who.append(s, sp);
    li.append(w, who);
    if(r.pending){
      const c = document.createElement("span"); c.className = "hint-sm"; c.textContent = "保存中…"; li.appendChild(c);
      li.classList.add("pending");
    }else if(isMine(r) || isAdmin){
      const acts = document.createElement("div"); acts.className = "acts";
      const ed = document.createElement("button");
      ed.className = "btn"; ed.textContent = editing === r.id ? "変更中" : "変更";
      ed.disabled = editing === r.id;
      ed.setAttribute("aria-label", md(r.date)+" "+r.start+" の予約を変更する");
      ed.onclick = () => startEdit(r);
      const x = document.createElement("button");
      x.className = "btn danger" + (armed === r.id ? " armed" : "");
      x.textContent = armed === r.id ? "取り消す" : "取消";
      x.setAttribute("aria-label", md(r.date)+" "+r.start+" の予約を取り消す");
      const doCancel = (btn, scope) => { armed = null; cancelBooking(r, scope); };
      x.onclick = () => {
        if(armed !== r.id){ armed = r.id; renderList(); setTimeout(() => { if(armed === r.id){ armed = null; renderList(); } }, 6000); return; }
        doCancel(x, "one");
      };
      if(armed === r.id && r.series){
        x.textContent = "この予約";
        const all = document.createElement("button");
        all.className = "btn danger armed"; all.textContent = "これ以降すべて";
        all.onclick = () => doCancel(all, "following");
        acts.append(x, all);
      }else acts.append(ed, x);
      if(saving) [...acts.children].forEach(c => { c.disabled = true; });
      li.appendChild(acts);
    }else li.appendChild(document.createElement("span"));
    li.addEventListener("click", ev => {
      if(ev.target.closest("button")) return;
      openDetail(r);
      selected = r.id; focusDate = parseYmd(r.date); renderWeek(); renderList();
    });
    ul.appendChild(li);
  }
}

function renderUsage(){
  const y = monthCursor.getFullYear(), m = monthCursor.getMonth();
  const isThis = y === new Date().getFullYear() && m === new Date().getMonth();
  $("u-title").textContent = y+"年"+(m+1)+"月の使用状況" + (isThis ? "（今月）" : "");
  const prefix = y+"-"+pad(m+1)+"-";
  const list = rows.filter(r => r.date.startsWith(prefix));   // 件数は開始日の月で数える
  const days = new Date(y, m+1, 0).getDate();
  // 時間は、その月の各日にかかる部分だけを足す（日をまたぐ予約は日ごとに分ける）
  const byDate = {}, segs = [];
  for(let dd = 1; dd <= days; dd++){
    const ds = prefix + pad(dd);
    for(const r of rows){ const g = segOn(r, ds); if(g){ segs.push({ g, ds }); (byDate[ds] = byDate[ds] || []).push(g); } }
  }
  const segH = x => (toMin(x.g.end) - toMin(x.g.start))/60;
  const hours = segs.reduce((s,x) => s+segH(x), 0);
  const occupied = Object.values(byDate).reduce((s,l) => s+occupiedHours(l), 0);
  const rate = occupied / (days*(CLOSE-OPEN)) * 100;
  $("k-count").innerHTML = list.length+"<small>件</small>";
  $("k-hours").innerHTML = fmtH(hours)+"<small>h</small>";
  $("k-rate").innerHTML = (Math.round(rate*10)/10)+"<small>%</small>";
  $("k-meter").style.width = Math.min(rate,100)+"%";

  const byP = {};
  for(const x of segs) byP[x.g.r.name] = (byP[x.g.r.name]||0) + segH(x);
  const ent = Object.entries(byP).sort((a,b) => b[1]-a[1]).slice(0,6);
  const max = ent.length ? ent[0][1] : 1;
  const bp = $("by-person"); bp.replaceChildren();
  if(!ent.length){ const p = document.createElement("p"); p.className = "empty"; p.textContent = "この月の利用はまだありません。"; bp.appendChild(p); }
  for(const [name,h] of ent){
    const row = document.createElement("div"); row.className = "bar";
    const n = document.createElement("span"); n.className = "nm"; n.textContent = name;
    const tr = document.createElement("span"); tr.className = "tr";
    const fill = document.createElement("span"); fill.style.width = (h/max*100)+"%"; tr.appendChild(fill);
    const v = document.createElement("span"); v.className = "val"; v.textContent = fmtH(h)+"h";
    row.append(n,tr,v); bp.appendChild(row);
  }

  const byW = [0,0,0,0,0,0,0];
  for(const x of segs) byW[parseYmd(x.ds).getDay()] += segH(x);
  const wmax = Math.max(...byW, 1);
  const wk = $("by-wday"); wk.replaceChildren();
  for(const i of [1,2,3,4,5,6,0]){
    const c = document.createElement("div");
    const v = document.createElement("em"); v.textContent = byW[i] ? fmtH(byW[i]) : "";
    const s = document.createElement("span"); s.style.height = (byW[i]/wmax*75)+"%";
    c.append(v, s, WD[i]); wk.appendChild(c);
  }
}

// ---- load ----
// サーバーから受け取ったデータを画面に反映する。fresh=false は前回の表示内容（このブラウザに保存）
let fresh = false;
function applyData(d, isFresh){
  const first = !loaded;
  loaded = true;
  if(isFresh){ fresh = true; $("notice").hidden = true; }
  rows = d.rows; isAdmin = d.isAdmin; calendarOn = d.config.calendar; me = d.me;
  if(isFresh && SESSION && !(me && me.loggedIn)) saveSession("");   // 期限切れのログインは消す
  pageUrl = d.config.pageUrl || "";
  googleClientId = d.config.googleClientId || "";
  // 会社の Workspace の URL（…/a/macros/会社のドメイン/s/…）はそのドメインのログインを求めるので、誰でも開ける形に直す
  loginUrl = (d.config.loginUrl || "").replace(/\/a\/macros\/[^\/]+\/s\//, "/macros/s/");
  if(!editing) paintMe();
  if(first){
    OPEN = d.config.openHour; CLOSE = d.config.closeHour; SLOT = d.config.slotMinutes || 15; ALLOW_OVERLAP = d.config.allowOverlap !== false;
    $("title").textContent = d.config.title;
    document.title = d.config.title;
    $("hours-note").textContent = (OPEN === 0 && CLOSE === 24 ? "24時間" : "利用時間 "+OPEN+":00–"+CLOSE+":00") + " ・ "+SLOT+"分単位";
    $("rate-note").textContent = "利用時間は予約ごとの合計です。稼働率は予約が入っている時間（重なりは1回だけ数える）を、1日"+(CLOSE-OPEN)+"時間（"+OPEN+":00–"+CLOSE+":00）× その月の日数で割っています。";
    fillTimes();
  }
  if(d.sheetUrl){ $("sheet-link").href = d.sheetUrl; $("sheet-link").hidden = false; }
  const ids = new Set(rows.map(r => r.id));
  if(isFresh && editing && !ids.has(editing)){ endEdit(); showResult("変更中の予約は取り消されました。", "err"); }
  const keep = resultShown ? [$("f-msg").textContent, $("f-msg").className] : null;
  render();
  if(keep){ $("f-msg").textContent = keep[0]; $("f-msg").className = keep[1]; }
  if(isFresh){ try{ localStorage.setItem("ob-snapshot", JSON.stringify(d)); }catch(e){} }
}

let refreshing = false;
async function refresh(){
  if(refreshing) return;
  refreshing = true;
  try{
    const d = await call("getData");
    if(!saving) applyData(d, true);   // 保存中は画面の内容（反映済み）を上書きしない
  }catch(e){
    const n = $("notice"); n.hidden = false;
    n.textContent = "予約台帳を読み込めませんでした（" + errText(e) + "）。ページを再読み込みしてください。";
  }finally{
    refreshing = false;
  }
}

// 前回の内容をすぐ表示しておき、裏で最新の予約を読み込む
try{ const snap = JSON.parse(localStorage.getItem("ob-snapshot") || "null"); if(snap && snap.rows) applyData(snap, false); }catch(e){}
render();
(async () => {
  // Google ログイン用から戻ってきたら、通行証を90日有効のログインに引き換えてから読み込む
  if(LOGIN_TICKET && LOGIN_TICKET.indexOf("__") !== 0){
    try{
      const r = await call("login", LOGIN_TICKET);
      saveSession(r.session);
      showResult("Google アカウント（" + r.email + "）でログインしました。", "ok");
    }catch(e){
      const n = $("notice"); n.hidden = false; n.textContent = errText(e);
    }
  }
  await refresh();
})();
setInterval(refresh, 60000);
setInterval(renderStatus, 30000);
document.addEventListener("visibilitychange", () => { if(!document.hidden) refresh(); });
